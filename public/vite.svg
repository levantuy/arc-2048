<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD75E"></stop>
      <stop offset="100%" stop-color="#F59E0B"></stop>
    </linearGradient>

    <!-- Center -->
    <radialGradient id="center" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#FFFDF7"></stop>
      <stop offset="100%" stop-color="#FFE7A7"></stop>
    </radialGradient>

    <!-- Glow -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <!-- Shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#7C3AED" flood-opacity="0.28"></feDropShadow>
    </filter>

    <!-- Shine -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"></stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect x="28" y="28" width="456" height="456" rx="110" fill="url(#bg)" filter="url(#shadow)"></rect>

  <!-- Gloss -->
  <path d="M70 70
           h372
           a40 40 0 0 1 40 40
           v55
           c-120-45-260-58-412-40V110
           a40 40 0 0 1 40-40z" fill="url(#shine)"></path>

  <!-- Grid -->
  <g opacity="0.18">
    <rect x="90" y="90" width="130" height="130" rx="24" fill="#fff"></rect>
    <rect x="292" y="90" width="130" height="130" rx="24" fill="#fff"></rect>
    <rect x="90" y="292" width="130" height="130" rx="24" fill="#fff"></rect>
    <rect x="292" y="292" width="130" height="130" rx="24" fill="#fff"></rect>
  </g>

  <!-- Center -->
  <circle cx="256" cy="256" r="105" fill="url(#center)" filter="url(#glow)"></circle>

  <!-- Number -->
  <text x="256" y="276" text-anchor="middle" font-size="74" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="900" fill="#B45309" letter-spacing="2">
    2048
  </text>

  <!-- Sparkles -->
  <g fill="#fff">
    <path d="M410 118
             l8 20
             20 8
             -20 8
             -8 20
             -8-20
             -20-8
             20-8z" opacity="0.95"></path>

    <circle cx="388" cy="366" r="6" opacity="0.9"></circle>
    <circle cx="122" cy="150" r="5" opacity="0.8"></circle>
    <circle cx="144" cy="386" r="4" opacity="0.7"></circle>
  </g>
</svg>